<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Place Order</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f4f4;
        padding: 20px;
      }

      .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .order-summary {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
      }

      .order-summary h3 {
        margin-bottom: 10px;
      }

      .order-summary p {
        margin: 8px 0;
      }

      .total {
        font-size: 22px;
        color: green;
        font-weight: bold;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      .success {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #d4edda;
        color: #155724;
        border-radius: 5px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Checkout Order</h1>

      <form id="orderForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" required />
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <textarea id="address" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <select id="payment">
            <option>Cash on Delivery</option>
            <option>UPI</option>
            <option>Credit Card</option>
            <option>Debit Card</option>
          </select>
        </div>

        <div class="order-summary">
          <h3>Order Summary</h3>
          <p>Laptop × 1</p>
          <p>Smartphone × 1</p>
          <hr />
          <br />
          <p class="total">Total: ₹70,000</p>
        </div>

        <button type="submit">Place Order</button>
      </form>

      <div class="success" id="successMsg">
        ✅ Order Placed Successfully! Thank you for shopping with us.
      </div>
    </div>

    <script>
      document
        .getElementById("orderForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          document.getElementById("successMsg").style.display = "block";

          this.reset();
        });
    </script>
  </body>
</html>
