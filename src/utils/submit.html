<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Receipt Generator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
      }

      .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #218838;
      }

      .receipt {
        display: none;
        margin-top: 25px;
        border: 2px solid #333;
        padding: 20px;
        border-radius: 10px;
      }

      .receipt h3 {
        text-align: center;
        margin-bottom: 15px;
      }

      .row {
        margin: 10px 0;
      }

      .total {
        font-size: 22px;
        font-weight: bold;
        color: green;
        text-align: right;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Payment Form</h2>

      <input type="text" id="customerName" placeholder="Customer Name" />

      <input type="text" id="productName" placeholder="Product Name" />

      <input type="number" id="amount" placeholder="Amount" />

      <select id="paymentMethod">
        <option>UPI</option>
        <option>Credit Card</option>
        <option>Debit Card</option>
        <option>Net Banking</option>
        <option>Cash</option>
      </select>

      <button onclick="generateReceipt()">Submit Payment</button>

      <div class="receipt" id="receipt">
        <h3>Payment Receipt</h3>

        <div class="row">
          <strong>Receipt No:</strong>
          <span id="receiptNo"></span>
        </div>

        <div class="row">
          <strong>Date:</strong>
          <span id="receiptDate"></span>
        </div>

        <div class="row">
          <strong>Customer:</strong>
          <span id="billCustomer"></span>
        </div>

        <div class="row">
          <strong>Product:</strong>
          <span id="billProduct"></span>
        </div>

        <div class="row">
          <strong>Payment Method:</strong>
          <span id="billMethod"></span>
        </div>

        <div class="total">Paid Amount: ₹<span id="billAmount"></span></div>

        <br />

        <button onclick="window.print()">Print Receipt</button>
      </div>
    </div>

    <script>
      function generateReceipt() {
        let customer = document.getElementById("customerName").value;

        let product = document.getElementById("productName").value;

        let amount = document.getElementById("amount").value;

        let method = document.getElementById("paymentMethod").value;

        if (customer === "" || product === "" || amount === "") {
          alert("Please fill all fields");
          return;
        }

        document.getElementById("receipt").style.display = "block";

        document.getElementById("receiptNo").innerText =
          "REC" + Math.floor(Math.random() * 100000);

        document.getElementById("receiptDate").innerText =
          new Date().toLocaleString();

        document.getElementById("billCustomer").innerText = customer;
        document.getElementById("billProduct").innerText = product;
        document.getElementById("billMethod").innerText = method;

        document.getElementById("billAmount").innerText =
          Number(amount).toLocaleString();
      }
    </script>
  </body>
</html>
